name: Wake alarm
# OFF by default. Runs every hour; arms only if Ollie posted "ARM YYYY-MM-DD HH:MM" (Eastern)
# for today to the wake topic (read via the site). No OFF: only a PASS stops it.
# One run at a time: the next hourly run waits in line, then sees the PASS (or a fresh alarm).
on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (off the busy :00 slot)
  workflow_dispatch:
    inputs:
      alarm_time:
        description: 'HH:MM Eastern, or "now" to test'
        default: "now"
      max_minutes:
        default: "10"
concurrency:
  group: wake-alarm
  cancel-in-progress: false
jobs:
  alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python alarm.py
        env:
          ALARM_TIME: ${{ inputs.alarm_time }}
          MAX_MINUTES: ${{ inputs.max_minutes || vars.MAX_MINUTES || '90' }}
          SITE: https://wake-proof.onrender.com
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
